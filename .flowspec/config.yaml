# Flowspec configuration for the Flowspec project itself (dogfooding)
# NOTE (Legion, 2026-06-15, dogfood finding): ConfigFile (config/mod.rs)
# deserializes ONLY top-level `languages` + `exclude`. The nested
# analysis.*/diagnostics.* structure below is aspirational and NOT yet wired
# (serde silently drops unknown fields). These top-level fields are operative
# until the nested config is implemented (major production-grade workstream,
# prioritized by dogfooding).
languages: ["rust"]
exclude:
  - "tests/fixtures/"
  - "flowspec-cli/tests/"
project:
  name: "flowspec"
  languages: ["rust"]

analysis:
  entry_points:
    - "src/main.rs::main"
    - "src/lib.rs::*"
  ignore:
    - "target/"
    - "tests/fixtures/"
    - ".flowspec/cache/"
  max_call_depth: 20
  max_type_chain: 10

diagnostics:
  enabled:
    - isolated_cluster
    - data_dead_end
    - partial_wiring
    - orphaned_implementation
    - duplication
    - contract_mismatch
    - circular_dependency
    - layer_violation
    - incomplete_migration
    - asymmetric_handling
    - stale_reference
    - phantom_dependency
    - missing_reexport

  layer_rules:
    - name: "cli should not access graph internals directly"
      from: "cli::*"
      to: "graph::internal::*"
      allowed_through: ["flowspec::*"]

    - name: "manifest should not access parser"
      from: "manifest::*"
      to: "parser::*"

  suppressions: []
