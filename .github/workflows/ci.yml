      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; verified upstream commit
        with:
          python-version: 3.11.15
      - name: Evidence directory
        run: mkdir -p evidence
      - name: Pinned Rust toolchain
        run: |
