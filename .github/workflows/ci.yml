name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (lib, -D warnings)
        run: cargo clippy -p flowspec --lib -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Oracle gate (false negatives and false positives on the committed fixture)
        run: cargo test -p flowspec-cli --test oracle_gate -- --nocapture
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Coverage (87% floor)
        run: cargo tarpaulin --workspace --skip-clean --timeout 1200 --fail-under 87 --out Xml --exclude-files 'flowspec-cli/tests/*' 'flowspec/src/*tests*.rs'
