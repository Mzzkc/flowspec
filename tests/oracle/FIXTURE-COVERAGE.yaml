# Fixture coverage manifest — all 13 diagnostic patterns.
#
# Wave 1B executable fixture truth. Paths are relative to the flowspec repo root
# and resolve via resolve_artifact_path (<repo_root>/<path>). For each `implemented`
# pattern the positive fixture MUST trip the detector and the adversarial fixture
# MUST NOT (proven live under --strict-fixtures). Deferred patterns (duplication,
# asymmetric_handling) ship nothing by default (README §7).
#
# status values:
#   implemented    — detector active; needs passing positive + adversarial fixtures at release
#   deferred       — out of v1 scope (README §7); emits nothing by default
#   off-by-default — implemented but experimental; opt-in, labelled, still fixture-covered

patterns:
  isolated_cluster:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/isolated_cluster/positive
    adversarial_fixture: tests/oracle/fixtures/python/isolated_cluster/adversarial
    notes: >-
      Positive is an unwired two-function cluster; adversarial has no connected component.

  data_dead_end:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/data_dead_end/positive
    adversarial_fixture: tests/oracle/fixtures/python/data_dead_end/adversarial
    notes: >-
      Positive is a private unused function; adversarial has no defined symbol.

  partial_wiring:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/partial_wiring/positive
    adversarial_fixture: tests/oracle/fixtures/python/partial_wiring/adversarial
    notes: >-
      Positive imports a shared function from three files but calls it from one;
      adversarial calls it from all importers.

  orphaned_impl:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/orphaned_impl/positive
    adversarial_fixture: tests/oracle/fixtures/python/orphaned_impl/adversarial
    notes: >-
      Positive is an unused private method; adversarial has no methods.

  duplication:
    status: deferred
    positive_fixture: tests/oracle/fixtures/python/duplication/positive
    adversarial_fixture: tests/oracle/fixtures/python/duplication/adversarial
    notes: >-
      Deferred for v1 per README section 7; fixtures document current call-set behavior
      but are not release-gated.

  contract_mismatch:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/contract_mismatch/positive
    adversarial_fixture: tests/oracle/fixtures/python/contract_mismatch/adversarial
    notes: >-
      Positive violates the Python @staticmethod contract; adversarial uses a correct
      static method signature.

  circular_dependency:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/circular_dependency/positive
    adversarial_fixture: tests/oracle/fixtures/python/circular_dependency/adversarial
    notes: >-
      Positive has a two-module import/call cycle; adversarial is a one-way chain.

  layer_violation:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/layer_violation/positive
    adversarial_fixture: tests/oracle/fixtures/python/layer_violation/adversarial
    notes: >-
      Positive is an API-to-repository Python call crossing a configured layer boundary;
      adversarial routes API through a service layer before reaching the repository.

  incomplete_migration:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/incomplete_migration/positive
    adversarial_fixture: tests/oracle/fixtures/python/incomplete_migration/adversarial
    notes: >-
      Positive has old/new APIs with split callers; adversarial has fully migrated callers.

  asymmetric_handling:
    status: deferred
    positive_fixture: tests/oracle/fixtures/python/asymmetric_handling/positive
    adversarial_fixture: tests/oracle/fixtures/python/asymmetric_handling/adversarial
    notes: >-
      Deferred for v1 per README section 7; fixtures document the planned CFG-backed scenario.

  stale_reference:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/stale_reference/positive
    adversarial_fixture: tests/oracle/fixtures/python/stale_reference/adversarial
    notes: >-
      Positive imports a missing symbol from an existing module; adversarial imports an
      existing symbol.

  phantom_dependency:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/phantom_dependency/positive
    adversarial_fixture: tests/oracle/fixtures/python/phantom_dependency/adversarial
    notes: >-
      Positive has an unused import; adversarial uses the import via prefix access.

  missing_reexport:
    status: implemented
    positive_fixture: tests/oracle/fixtures/python/missing_reexport/positive
    adversarial_fixture: tests/oracle/fixtures/python/missing_reexport/adversarial
    notes: >-
      Positive omits a public submodule symbol from __init__; adversarial re-exports it
      explicitly.
