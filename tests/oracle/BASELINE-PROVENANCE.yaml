# Baseline provenance — pins EXACTLY which binary, on which commit, produced the raw
# findings the classifications review. Wave 1A ships this as a TEMPLATE; Wave 1B fills
# every TBD-FILL-IN-1B at review time. The validator checks structure now, and (once a
# real baseline exists) that no value remains TBD-FILL-IN-1B.
#
# A classification set reviewed against binary X is NOT valid for binary Y without
# re-review. The comparator checks provenance drift as part of R008 (count-delta review).
# See tests/oracle/SCHEMA.md §3.

git:
  flowspec_sha: TBD-FILL-IN-1B              # git -C <flowspec-repo> rev-parse HEAD
  flowspec_status_clean: TBD-FILL-IN-1B     # true if `git status --short` empty at review time
  flowspec_status_summary: TBD-FILL-IN-1B   # raw `git status --short` output ("" if clean)

binary:
  path: TBD-FILL-IN-1B                      # e.g. target/release/flowspec (relative to flowspec repo)
  sha256: TBD-FILL-IN-1B                    # sha256sum of the binary used for the dogfood run
  mtime: TBD-FILL-IN-1B                     # ISO-8601 mtime of the binary

version: TBD-FILL-IN-1B                     # exact `flowspec --version` output

# The exact diagnose + trace command lines provenance (for reproducibility + R005/R008).
commands:
  diagnose_self: >
    target/release/flowspec diagnose <flowspec-repo> -f json -q
  diagnose_marianne: >
    target/release/flowspec diagnose <marianne-repo> -f json -q
  trace_python_backward_format_output: >
    target/release/flowspec trace tests/fixtures/python/cross_file/flow_trace -s format_output --direction backward -f json -q
  trace_js_backward_helper: >
    target/release/flowspec trace tests/fixtures/js/cross_file/esm_named -s helper --direction backward -f json -q
  trace_rust_backward_helper: >
    target/release/flowspec trace tests/fixtures/rust/cross_file -s helper --direction backward -f json -q
  trace_rust_forward_entry_point: >
    target/release/flowspec trace tests/fixtures/rust/cross_file -s entry_point --direction forward -f json -q

targets:
  self:
    repo_path: <flowspec-repo>
    repo_sha: TBD-FILL-IN-1B                 # git -C <self> rev-parse HEAD
    diagnose_command: >
      target/release/flowspec diagnose <flowspec-repo> -f json -q
    diagnose_exit_code: TBD-FILL-IN-1B       # 0 = clean, 2 = findings present (both acceptable)
    raw_findings: TBD-FILL-IN-1B             # total emitted findings (int)
    by_pattern:                              # count per canonical snake_case name()
      isolated_cluster: TBD-FILL-IN-1B
      data_dead_end: TBD-FILL-IN-1B
      partial_wiring: TBD-FILL-IN-1B
      orphaned_impl: TBD-FILL-IN-1B
      duplication: TBD-FILL-IN-1B
      contract_mismatch: TBD-FILL-IN-1B
      circular_dependency: TBD-FILL-IN-1B
      layer_violation: TBD-FILL-IN-1B
      incomplete_migration: TBD-FILL-IN-1B
      asymmetric_handling: TBD-FILL-IN-1B
      stale_reference: TBD-FILL-IN-1B
      phantom_dependency: TBD-FILL-IN-1B
      missing_reexport: TBD-FILL-IN-1B

  marianne:
    repo_path: <marianne-repo>
    repo_sha: TBD-FILL-IN-1B                 # git -C <marianne> rev-parse HEAD
    diagnose_command: >
      target/release/flowspec diagnose <marianne-repo> -f json -q
    diagnose_exit_code: TBD-FILL-IN-1B       # 0 = clean, 2 = findings present (both acceptable)
    raw_findings: TBD-FILL-IN-1B             # total emitted findings (int)
    by_pattern:
      isolated_cluster: TBD-FILL-IN-1B
      data_dead_end: TBD-FILL-IN-1B
      partial_wiring: TBD-FILL-IN-1B
      orphaned_impl: TBD-FILL-IN-1B
      duplication: TBD-FILL-IN-1B
      contract_mismatch: TBD-FILL-IN-1B
      circular_dependency: TBD-FILL-IN-1B
      layer_violation: TBD-FILL-IN-1B
      incomplete_migration: TBD-FILL-IN-1B
      asymmetric_handling: TBD-FILL-IN-1B
      stale_reference: TBD-FILL-IN-1B
      phantom_dependency: TBD-FILL-IN-1B
      missing_reexport: TBD-FILL-IN-1B

# Cache-equivalence provenance (for R007: full vs incremental). Wave 3 fills this.
cache_equivalence:
